name: Windows Debug Build

on:
  workflow_call:
    outputs:
      artifact-path:
        description: "Path to the built debug executable"
        value: ${{ jobs.build.outputs.artifact-path }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-path: jumble.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure debug build with qmake
        run: qmake -r Jumble.pro

      - name: Build debug
        run: make -j8

      - name: Verify debug build artifacts
        run: |
          if (-Not (Test-Path jumble.exe)) { exit 1 }
          echo "Built (debug): jumble.exe"