name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Build every configuration. `mode` is exported as BUILD_MODE, which
      # qmake uses to select the matching configure (debug or release).
      matrix:
        mode: [debug, release]

    env:
      BUILD_MODE: ${{ matrix.mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure ${{ matrix.mode }} with qmake
        run: qmake -r Jumble.pro

      - name: Build ${{ matrix.mode }}
        run: make -j8

      - name: Verify ${{ matrix.mode }} build artifacts
        run: |
          test -f src/ui/jumble
          test -f tests/jumble_tests
          echo "Built ($BUILD_MODE): src/ui/jumble and tests/jumble_tests"

  build-macos:
    # Builds a macOS app bundle and publishes it as a downloadable artifact.
    # After the run succeeds, open the run's "Artifacts" tab on Actions
    # (or the PR's "Artifacts" section) and download
    # jumble-macos-arm64-release.zip.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure release build with qmake
        run: qmake -r Jumble.pro

      - name: Build release
        run: make -j8

      - name: Verify app bundle
        run: |
          test -d src/ui/jumble.app
          test -x src/ui/jumble.app/Contents/MacOS/jumble
          echo "Built: src/ui/jumble.app"

      - name: Package artifact
        run: |
          # The user needs the .app bundle and the dictionary. Zip them
          # together into a single artifact. `ditto` preserves resource forks
          # and permissions better than `zip` for macOS bundles.
          ditto -c -k --sequesterRsrc \
            src/ui/jumble.app \
            jumble-macos-arm64-release.zip
          zip -q jumble-macos-arm64-release.zip dictionary.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-release
          path: jumble-macos-arm64-release.zip
          if-no-files-found: error
