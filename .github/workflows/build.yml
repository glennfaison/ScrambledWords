name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qmake qtbase5-dev

      - name: Configure with qmake
        run: qmake -r Jumble.pro

      - name: Build
        run: make -j8

      - name: Verify build artifacts
        run: |
          test -f src/ui/jumble
          test -f tests/jumble_tests
          echo "Built: src/ui/jumble and tests/jumble_tests"
