name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system"
        required: true
        type: choice
        options:
          - ubuntu
          - macos
          - windows
        default: ubuntu
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build-ubuntu:
    name: Build (ubuntu-${{ github.event.inputs.build_type || 'debug' }})
    if: github.event_name == 'push' || github.event.inputs.os == 'ubuntu'
    uses: ./.github/workflows/build-workflows/build-ubuntu.yml
    with:
      build_type: ${{ github.event.inputs.build_type || 'debug' }}

  build-macos:
    name: Build (macos-${{ github.event.inputs.build_type || 'debug' }})
    if: github.event_name != 'push' && github.event.inputs.os == 'macos'
    uses: ./.github/workflows/build-workflows/build-macos.yml
    with:
      build_type: ${{ github.event.inputs.build_type || 'debug' }}

  build-windows:
    name: Build (windows-${{ github.event.inputs.build_type || 'debug' }})
    if: github.event_name != 'push' && github.event.inputs.os == 'windows'
    uses: ./.github/workflows/build-workflows/build-windows.yml
    with:
      build_type: ${{ github.event.inputs.build_type || 'debug' }}