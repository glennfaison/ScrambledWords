name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system"
        required: true
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows
        default: all
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which OS / build-type combinations to run.
  # push + pull_request: every OS in debug and release; dispatch: what was picked.
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          os="${{ github.event.inputs.os || 'all' }}"
          type="${{ github.event.inputs.build_type }}"
          if [ "$os" = "all" ]; then oses='"ubuntu","macos","windows"'; else oses="\"$os\""; fi
          if [ -z "$type" ]; then types='"debug","release"'; else types="\"$type\""; fi
          echo "matrix={\"os\":[$oses],\"build_type\":[$types]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }}-${{ matrix.build_type }})
    needs: plan
    # Test the Intel Mac build natively rather than mislabelling it ARM64.
    runs-on: ${{ matrix.os == 'macos' && 'macos-15-intel' || format('{0}-latest', matrix.os) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Qt setup ───────────────────────────────────────
      - name: Install Qt 5 (ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev
      - name: Install Qt 5 (windows)
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'
      - name: Install Qt 6 (macos)
        if: matrix.os == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 5.15.2's prebuilt Cocoa plugin still links removed AGL.
          version: '6.10.1'
          arch: 'clang_64'
          cache: 'true'
      - name: Set up MSVC (windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify qmake is available
        run: qmake --version

      # ── Build ──────────────────────────────────────────
      - name: Configure (${{ matrix.build_type }})
        shell: bash
        run: qmake -r Jumble.pro "CONFIG-=debug_and_release" "CONFIG+=${{ matrix.build_type }}"
      - name: Build (unix)
        if: matrix.os != 'windows'
        run: make -j4
      - name: Build (windows)
        if: matrix.os == 'windows'
        run: nmake

      # ── Verify ─────────────────────────────────────────
      - name: Verify artifact (ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          test -x jumble
          # Smoke test: the app must start and keep running without crashing.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 5 ./jumble
          code=$?
          if [ "$code" -ne 124 ]; then echo "jumble exited early with code $code"; exit 1; fi
          echo "jumble started and ran for 5s"
      - name: Verify artifact (macos)
        if: matrix.os == 'macos'
        run: test -f jumble.app/Contents/MacOS/jumble
      - name: Verify artifact (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $exe = @('jumble.exe', 'release/jumble.exe', 'debug/jumble.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-Not $exe) { Write-Error "jumble.exe not found"; exit 1 }
          echo "Built: $exe"

      # ── Package (macOS) ────────────────────────────────
      - name: Bundle Qt frameworks with macdeployqt
        if: matrix.os == 'macos'
        run: |
          macdeployqt jumble.app -verbose=2
          codesign --force --deep --sign - jumble.app
      - name: Prepare macOS artifact
        if: matrix.os == 'macos'
        run: |
          arch=$(lipo -archs jumble.app/Contents/MacOS/jumble | tr ' ' '-')
          name=jumble-macos-$arch-${{ matrix.build_type }}
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          staging=$(mktemp -d)
          ditto jumble.app "$staging/jumble.app"
          cp dictionary.txt "$staging/"
          ditto -c -k --sequesterRsrc "$staging" "$name.zip"
      - name: Test the extracted macOS artifact
        if: matrix.os == 'macos'
        run: |
          python3 -m unittest discover -s tests/macos -p 'test_*.py' -v
          extracted=$(mktemp -d)
          ditto -x -k "$ARTIFACT_NAME.zip" "$extracted"
          python3 tests/macos/verify_bundle.py "$extracted/jumble.app"
      - name: Upload macOS artifact
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

  visual-tests:
    name: Visual tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Qt 5
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev fontconfig
      - name: Build visual tests
        run: |
          mkdir -p build-tests && cd build-tests
          qmake ../tests/visual/visual.pro
          make -j4
      - name: Run visual tests
        working-directory: build-tests
        env:
          QT_QPA_PLATFORM: offscreen
          VISUAL_OUTPUT_DIR: ${{ github.workspace }}/visual-output
        run: ./tst_visual -o -,txt -o visual-tests.xml,junitxml
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: visual-output/
          if-no-files-found: ignore
