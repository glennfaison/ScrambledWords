name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Run the test suite against a debug build.
    env:
      BUILD_MODE: debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure debug build with qmake
        run: qmake -r Jumble.pro

      - name: Build
        run: make -j8

      - name: Run test suite
        run: tests/jumble_tests
