name: Ubuntu Release Build

on:
  workflow_call:
    outputs:
      artifact-path:
        description: "Path to the built release executable"
        value: ${{ jobs.build.outputs.artifact-path }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: jumble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure release build with qmake
        run: qmake -r Jumble.pro

      - name: Build release
        run: make -j8

      - name: Verify release build artifacts
        run: |
          test -f jumble
          echo "Built (release): jumble"