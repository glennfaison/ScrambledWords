name: macOS Build

on:
  workflow_call:
    inputs:
      build_type:
        description: "Build type (debug or release)"
        required: true
        type: string
    outputs:
      artifact-path:
        description: "Path to the built executable"
        value: ${{ jobs.build.outputs.artifact-path }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      artifact-path: jumble-macos-arm64-${{ inputs.build_type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure ${{ inputs.build_type }} build with qmake
        run: qmake -r Jumble.pro

      - name: Build ${{ inputs.build_type }}
        run: make -j8

      - name: Verify build artifact
        run: |
          test -f jumble
          echo "Built (${{ inputs.build_type }}): jumble"

      - name: Prepare artifact directory
        run: |
          rm -rf jumble-macos-arm64-${{ inputs.build_type }}
          mkdir -p jumble-macos-arm64-${{ inputs.build_type }}
          cp jumble jumble-macos-arm64-${{ inputs.build_type }}/
          cp dictionary.txt jumble-macos-arm64-${{ inputs.build_type }}/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-${{ inputs.build_type }}
          path: jumble-macos-arm64-${{ inputs.build_type }}
          if-no-files-found: error

  debug:
    needs: []
    runs-on: macos-latest
    outputs:
      artifact-path: jumble-macos-arm64-debug
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure debug build with qmake
        run: qmake -r Jumble.pro

      - name: Build debug
        run: make -j8

      - name: Verify debug build artifacts
        run: |
          test -f jumble
          echo "Built (debug): jumble"

      - name: Prepare artifact directory
        run: |
          rm -rf jumble-macos-arm64-debug
          mkdir -p jumble-macos-arm64-debug
          cp jumble jumble-macos-arm64-debug/
          cp dictionary.txt jumble-macos-arm64-debug/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-debug
          path: jumble-macos-arm64-debug
          if-no-files-found: error

  release:
    needs: []
    runs-on: macos-latest
    outputs:
      artifact-path: jumble-macos-arm64-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure release build with qmake
        run: qmake -r Jumble.pro

      - name: Build release
        run: make -j8

      - name: Verify build artifact
        run: |
          test -f jumble
          echo "Built: jumble"

      - name: Prepare artifact directory
        run: |
          rm -rf jumble-macos-arm64-release
          mkdir -p jumble-macos-arm64-release
          cp jumble jumble-macos-arm64-release/
          cp dictionary.txt jumble-macos-arm64-release/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-release
          path: jumble-macos-arm64-release
          if-no-files-found: error