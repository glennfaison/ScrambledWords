name: macOS Release Build

on:
  workflow_call:
    outputs:
      artifact-path:
        description: "Path to the built release executable"
        value: ${{ jobs.build.outputs.artifact-path }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      artifact-path: jumble-macos-arm64-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure release build with qmake
        run: qmake -r Jumble.pro

      - name: Build release
        run: make -j8

      - name: Verify build artifact
        run: |
          test -f jumble
          echo "Built: jumble"

      - name: Prepare artifact directory
        run: |
          rm -rf jumble-macos-arm64-release
          mkdir -p jumble-macos-arm64-release
          cp jumble jumble-macos-arm64-release/
          cp dictionary.txt jumble-macos-arm64-release/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-release
          path: jumble-macos-arm64-release
          if-no-files-found: error