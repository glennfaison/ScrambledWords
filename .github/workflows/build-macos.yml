name: macOS Release Build

on:
  workflow_call:
    outputs:
      artifact-path:
        description: "Path to the built release executable"
        value: ${{ jobs.build.outputs.artifact-path }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      artifact-path: src/ui/jumble.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          cache: 'true'

      - name: Verify qmake is available
        run: qmake --version

      - name: Configure release build with qmake
        run: qmake -r Jumble.pro

      - name: Patch Makefiles (remove removed AGL framework)
        run: |
          sed -i '' 's/-framework AGL//g' src/ui/Makefile tests/Makefile

      - name: Build release
        run: make -j8

      - name: Deploy Qt frameworks into bundle (macdeployqt)
        run: |
          "${QT_ROOT_DIR}/bin/macdeployqt" src/ui/jumble.app -verbose=2

      - name: Copy dictionary into app bundle
        run: cp dictionary.txt src/ui/jumble.app/Contents/MacOS/

      - name: Verify app bundle
        run: |
          test -d src/ui/jumble.app
          test -x src/ui/jumble.app/Contents/MacOS/jumble
          echo "Built: src/ui/jumble.app"

      - name: Prepare artifact directory
        run: |
          rm -rf jumble-macos-arm64-release
          mkdir -p jumble-macos-arm64-release
          ditto src/ui/jumble.app jumble-macos-arm64-release/Jumble.app
          cp dictionary.txt jumble-macos-arm64-release/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: jumble-macos-arm64-release
          path: jumble-macos-arm64-release
          if-no-files-found: error
